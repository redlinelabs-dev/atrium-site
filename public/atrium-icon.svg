<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep, calm background gradient (matches the app's dark surfaces) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <!-- Electric indigo for the A, top-bright to bottom-deep -->
    <linearGradient id="indigo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8e9bff"/>
      <stop offset="1" stop-color="#5563f0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <!-- soft inner highlight on the tile top edge -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sheen)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="206.5" fill="none"
        stroke="#6d7cff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- The A: two angled legs meeting at an apex, geometric, rounded caps.
       Drawn as thick strokes so it stays legible at 16px. -->
  <g fill="none" stroke="url(#indigo)" stroke-width="118"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- left leg: apex (512,300) down to (300,748) -->
    <path d="M512 300 L300 748"/>
    <!-- right leg: apex (512,300) down to (724,748) -->
    <path d="M512 300 L724 748"/>
  </g>

  <!-- Green liveness dot sits where the A's crossbar would be -->
  <circle cx="512" cy="612" r="150" fill="url(#dotGlow)"/>
  <circle cx="512" cy="612" r="62" fill="#00e676"/>
  <circle cx="512" cy="612" r="62" fill="none" stroke="#0c0e14" stroke-width="10" stroke-opacity="0.35"/>
</svg>
