name: Deploy docs to GitHub Pages

# Builds the Astro + Starlight site and deploys it to GitHub Pages. latest.json + llms.txt live in
# public/, so they publish at the site root unchanged (the app's updater polls
# https://redlinelabs-dev.github.io/atrium-site/latest.json — that URL must keep working).
#
# ONE-TIME: in repo Settings → Pages, set "Source" to "GitHub Actions" (was "Deploy from a branch").
# Until that flip, the old static root files keep serving; flip only after verifying a build here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
