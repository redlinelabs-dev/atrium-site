name: Deploy docs to GitHub Pages

# Builds the Astro + Starlight site and deploys it to GitHub Pages. latest.json + llms.txt live in
# public/, so they publish at the site root unchanged (the app's updater polls
# https://atrium.redlinelabs.dev/latest.json; apps ≤0.15.x poll the old github.io URL, which 301-redirects here — both must keep working).
#
# Explicit bun steps (not withastro/action) — replicates the local `bun install && bun run build` flow
# exactly and surfaces the full Astro output on failure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build site
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # actions/deploy-pages intermittently fails with "Deployment failed, try again later"
      # (GitHub-side transient; build + artifact are fine). One automatic retry absorbs it —
      # if THIS also fails, the job goes red and it's worth a human look.
      - name: Retry deploy (absorb the known Pages transient)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        # NB: deploy-pages' timeout is capped at 600000 ms (10 min) — it cannot be
        # raised. If deploys fail stuck in deployment_queued, check githubstatus.com
        # (Pages incident) and re-run once the incident clears.
