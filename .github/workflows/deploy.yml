name: Deploy docs to GitHub Pages

# Builds the Astro + Starlight site and deploys it to GitHub Pages. latest.json + llms.txt live in
# public/, so they publish at the site root unchanged (the app's updater polls
# https://redlinelabs-dev.github.io/atrium-site/latest.json — that URL must keep working).
#
# Explicit bun steps (not withastro/action) — replicates the local `bun install && bun run build` flow
# exactly and surfaces the full Astro output on failure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build site
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
